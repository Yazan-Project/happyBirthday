<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Hulk Fist Smash -->
  <defs>
    <linearGradient id="fistGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A7C3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B3A1A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="knuckleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA84A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5A27;stop-opacity:1" />
    </linearGradient>
    <filter id="fistShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#1B3A1A" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Impact lines -->
  <g stroke="#5BA84A" stroke-width="3" opacity="0.6" filter="url(#fistShadow)">
    <line x1="50" y1="180" x2="30" y2="195" stroke-linecap="round"/>
    <line x1="80" y1="185" x2="50" y2="200" stroke-linecap="round"/>
    <line x1="110" y1="185" x2="90" y2="200" stroke-linecap="round"/>
    <line x1="140" y1="180" x2="160" y2="195" stroke-linecap="round"/>
    <line x1="90" y1="190" x2="90" y2="205" stroke-linecap="round"/>
    <line x1="100" y1="190" x2="100" y2="205" stroke-linecap="round"/>
  </g>
  
  <!-- Wrist/Forearm -->
  <path d="M70 40 L65 80 Q60 100 70 110 L70 130 Q70 140 80 140 L120 140 Q130 140 130 130 L130 110 Q140 100 135 80 L130 40 Z" 
        fill="url(#fistGradient)" filter="url(#fistShadow)"/>
  
  <!-- Wrist band -->
  <path d="M65 80 Q60 100 70 110 L135 80 Q140 100 135 80" fill="#1B3A1A" opacity="0.8"/>
  
  <!-- Knuckles -->
  <ellipse cx="85" cy="140" rx="18" ry="12" fill="url(#knuckleGradient)" filter="url(#innerGlow)"/>
  <ellipse cx="105" cy="138" rx="20" ry="14" fill="url(#knuckleGradient)" filter="url(#innerGlow)"/>
  <ellipse cx="122" cy="140" rx="16" ry="11" fill="url(#knuckleGradient)" filter="url(#innerGlow)"/>
  
  <!-- Finger details -->
  <path d="M75 140 Q75 160 85 165 Q95 170 105 165 Q115 160 115 140" 
        stroke="#1B3A1A" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M95 138 Q95 165 105 170 Q115 175 125 168 Q132 160 132 138" 
        stroke="#1B3A1A" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Veins on forearm -->
  <path d="M75 60 Q80 75 85 90" stroke="#1B3A1A" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M125 60 Q120 75 115 90" stroke="#1B3A1A" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M95 50 Q100 70 100 95" stroke="#1B3A1A" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Shirt cuff -->
  <path d="M65 40 Q70 35 75 40 L125 40 Q130 35 135 40 L130 50 Q125 55 70 50 Q65 55 60 50 Z" 
        fill="#0D2B1A" opacity="0.9"/>
  
  <!-- Impact burst -->
  <g fill="#5BA84A" opacity="0.7">
    <ellipse cx="95" cy="165" rx="30" ry="8" transform="rotate(-15 95 165)"/>
    <ellipse cx="95" cy="165" rx="8" ry="30" transform="rotate(-15 95 165)"/>
    <ellipse cx="95" cy="165" rx="20" ry="5" transform="rotate(15 95 165)"/>
    <ellipse cx="95" cy="165" rx="5" ry="20" transform="rotate(15 95 165)"/>
  </g>
  
  <!-- Small debris -->
  <g fill="#3D6B32" opacity="0.8">
    <circle cx="60" cy="170" r="3"/>
    <circle cx="135" cy="168" r="2"/>
    <circle cx="50" cy="180" r="2.5"/>
    <circle cx="142" cy="175" r="1.5"/>
    <circle cx="45" cy="165" r="2"/>
    <circle cx="148" cy="160" r="1.5"/>
  </g>
</svg>